[project]
name = "quote-extraction"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.7.0",
    "googleapis-common-protos>=1.75.3",
    "grpc-interceptor>=0.15.4",
    "grpcio-status>=1.84.0",
    "grpcio-tools>=1.83.1",
    "langextract>=1.7.0",
    "typer>=0.27.2",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-grpc>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "protos"]

[project.scripts]
serve = "src.main:main"
test = "src.run_tests:main"
