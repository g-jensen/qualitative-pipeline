[project]
name = "quote-extraction"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "grpcio-tools>=1.83.1",
    "langextract>=1.6.0",
    "typer>=0.27.2",
]

[tool.pyright]
extraPaths = ["src"]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-grpc>=0.8.0",
]